# Security and cache headers are set once at server level from these maps.
# Do not add `add_header` inside a location: nginx then drops every
# server-level header for that location. packages/web/tests/security-headers.test.ts
# checks this file against packages/web/src/security-headers.ts.

map $uri $ecad_content_security_policy {
    # OCCT's WASM loader evaluates generated code inside the STEP worker.
    "~^/assets/[^/]+\.worker-[^/]+\.js$" "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    # The prerendered shell has inline TanStack Start hydration scripts.
    default "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

map $uri $ecad_cache_control {
    /_shell.html "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name ecad.ropi.dev;

    root /home/ropi/ecad/packages/web/dist/client;
    index _shell.html;

    add_header Content-Security-Policy $ecad_content_security_policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # An empty value omits the header.
    add_header Cache-Control $ecad_cache_control;

    location /assets/ {
        try_files $uri =404;
    }

    location /examples/ {
        try_files $uri =404;
    }

    location ~ ^/(api|mcp|_serverFn|demo/api)(/|$) {
        return 404;
    }

    location / {
        try_files $uri /_shell.html;
    }
}
