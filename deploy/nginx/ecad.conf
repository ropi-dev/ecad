server {
    listen 80;
    listen [::]:80;
    server_name ecad.ropi.dev;

    root /home/ropi/ecad/packages/web/dist/client;
    index _shell.html;

    location = /_shell.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /examples/ {
        try_files $uri =404;
    }

    location ~ ^/(api|mcp|_serverFn|demo/api)(/|$) {
        return 404;
    }

    location / {
        try_files $uri /_shell.html;
    }
}
