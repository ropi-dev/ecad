name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: pnpm run lint
          - name: Typecheck
            command: pnpm run typecheck
          - name: Unit tests
            command: pnpm test
          - name: Build web
            command: pnpm run build:web
          - name: Build desktop
            command: pnpm run build:desktop
          - name: Build CLI
            command: pnpm run build:cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run check
        run: ${{ matrix.command }}

  deb:
    name: Debian package
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The packager downloads its own Electron build for the package.
      - name: Build package
        run: pnpm run package:deb
      - name: Install package
        run: |
          sudo apt-get update
          sudo apt-get install --yes ./dist/deb/*.deb
      - name: Run the installed CLI
        run: |
          ecad --version
          ecad --drawing "$RUNNER_TEMP/check.ecaddraw" placeRectangle \
            '{"x":0,"y":0,"width":20,"height":10,"rotation":0,"lineWidth":0.25}'
      - name: Upload package
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ecad-deb
          path: dist/deb/*.deb
          retention-days: 7
          if-no-files-found: error
