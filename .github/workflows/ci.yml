name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: pnpm run lint
          - name: Typecheck
            command: pnpm run typecheck
          - name: Unit tests
            command: pnpm test
          - name: Build web
            command: pnpm run build:web
          - name: Build desktop
            command: pnpm run build:desktop
          - name: Build CLI
            command: pnpm run build:cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run check
        run: ${{ matrix.command }}

  deb:
    name: Debian package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The packager downloads its own Electron build for the package.
      - name: Build package
        run: pnpm run package:deb
      - name: Install package
        run: |
          sudo apt-get update
          sudo apt-get install --yes ./dist/deb/*.deb
      - name: Run the installed CLI
        run: |
          ecad --version
          ecad --drawing "$RUNNER_TEMP/check.ecaddraw" placeRectangle \
            '{"x":0,"y":0,"width":20,"height":10,"rotation":0,"lineWidth":0.25}'
      - name: Upload package
        continue-on-error: ${{ github.event_name != 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ecad-deb
          path: dist/deb/*.deb
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish desktop release
    needs: [checks, deb]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ecad-deb
          path: dist/deb
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          deb=$(echo dist/deb/ecad_*_amd64.deb)
          version=$(basename "$deb" _amd64.deb)
          version=${version#ecad_}
          stamp=${version#*+git}
          tag="desktop-${stamp/./-}"
          gh release delete "$tag" --yes --cleanup-tag 2> /dev/null || true
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          latest=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)
          gh release create "$tag" "$deb" \
            --target "$GITHUB_SHA" \
            --title "ECAD desktop $version" \
            --generate-notes \
            --latest="$latest"
      - name: Remove old releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("desktop-"))]
              | sort_by(.createdAt) | reverse | .[20:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --yes --cleanup-tag
            done
