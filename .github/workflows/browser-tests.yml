name: Browser tests

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  chromium:
    name: Chromium ${{ matrix.shard }}/2
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Install software graphics dependencies
        run: sudo apt-get install --no-install-recommends -y libvulkan1 mesa-vulkan-drivers
      - name: Run browser tests
        run: >-
          pnpm run test:browser
          --forbid-only
          --fully-parallel
          --workers=2
          --shard=${{ matrix.shard }}/2
          --reporter=line,github,html
          --trace=retain-on-failure
      - name: Upload browser report and failure traces
        if: ${{ !cancelled() }}
        # Report storage limits must not change the test result.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chromium-results-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  performance-smoke:
    # Checks that every performance scenario still runs and records its
    # measurements. Hosted-runner timing is unreliable, so this job never
    # checks timing budgets or baselines; see docs/performance.md.
    name: Performance scenarios (smoke)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      ECAD_PERF_SMOKE: "1"
      ECAD_PERF_RUNS: "1"
      ECAD_PERF_CPU: "1"
      ECAD_PERF_TRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Install software graphics dependencies
        run: sudo apt-get install --no-install-recommends -y libvulkan1 mesa-vulkan-drivers
      - name: Run performance scenarios
        run: pnpm run perf --forbid-only --workers=3
      - name: Upload performance report and failures
        if: ${{ !cancelled() }}
        # Report storage limits must not change the test result.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: performance-smoke
          path: |
            /tmp/ecad/*/perf-artifacts/latest.json
            /tmp/ecad/*/perf-artifacts/build.log
            /tmp/ecad/*/perf-artifacts/results/
          retention-days: 7
          if-no-files-found: ignore
